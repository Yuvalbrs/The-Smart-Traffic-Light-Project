# Fully pinned dependency set for the Docker image - generated with `pip freeze` INSIDE a
# verified-working container, then committed. Regenerate with:
#
#   docker compose run --rm --entrypoint bash hub -c 'pip freeze --all'
#
# Why this file exists: requirements.txt is loosely pinned on purpose (it is the developer-facing
# list), but this project pre-registers hypotheses and records git_sha + sumo_version on every run.
# A container that resolves different versions next week would quietly break that contract, so the
# image builds from an exact set.
#
# torch is pinned to 2.12.1+cpu to MATCH the environment that produced the recorded campaign. The
# container originally resolved 2.14.0; the checkpoints load either way, but re-running an
# evaluation under a different torch than the results were generated with is exactly the kind of
# silent provenance drift this project exists to prevent.
