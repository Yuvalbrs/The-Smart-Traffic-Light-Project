[project]
name = "smart-traffic-rl"
version = "0.0.0"
description = "DQN + frozen-LSTM traffic-signal controller for a single 4-way intersection in SUMO."
requires-python = ">=3.11"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# T-05-01: the API hub tests are async (bounded asyncio queues); auto mode means they
# need no per-test event-loop boilerplate.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
